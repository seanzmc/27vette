name: Release candidate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-candidate:
    name: release-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install workbook dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Verify six-model release candidate
        run: >-
          python scripts/verify_workbook_candidate.py
          --workbook stingray_master.xlsx
          --changed-model '*'
          --report candidate-report.json

      - name: Upload candidate report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-report
          path: candidate-report.json
          if-no-files-found: ignore
          retention-days: 14
