name: Release candidate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run the complete validation inventory in bounded parallel shards
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: plan validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      shard-count: ${{ steps.plan.outputs.shard-count }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Select changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            diff_base="$BASE_SHA"
          else
            diff_base="HEAD^"
          fi
          git diff --name-only --diff-filter=ACMRD "$diff_base" HEAD > changed-files.txt

      - name: Build validation plan
        id: plan
        env:
          FULL_SUITE: ${{ github.event_name == 'workflow_dispatch' && inputs.full_suite }}
        run: |
          args=(
            --changed-file-list changed-files.txt
            --output validation-matrix.json
          )
          if [[ "$FULL_SUITE" == "true" ]] || grep -Eq \
            '^(\.github/|scripts/(finalize_ci_validation_plan|plan_ci_validation|run_layered_validation|split_ci_validation_plan|test_finalize_ci_validation_plan|test_split_ci_validation_plan)\.py$|tests/(test_run_layered_validation|test_validation_catalog)\.py$|tests/validation_catalog\.json$)' \
            changed-files.txt; then
            args+=(--full)
          fi
          python scripts/test_finalize_ci_validation_plan.py
          python scripts/test_split_ci_validation_plan.py
          python scripts/plan_ci_validation.py "${args[@]}"
          python scripts/finalize_ci_validation_plan.py --plan validation-matrix.json
          python scripts/split_ci_validation_plan.py --plan validation-matrix.json
          echo "matrix=$(jq -c '{include: .include}' validation-matrix.json)" >> "$GITHUB_OUTPUT"
          echo "shard-count=$(jq '.include | length' validation-matrix.json)" >> "$GITHUB_OUTPUT"

      - name: Publish validation plan summary
        run: |
          echo "## Validation plan" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          jq -r '.include[] | "- **\(.name)** — \(.description)"' validation-matrix.json \
            >> "$GITHUB_STEP_SUMMARY"
          jq -r 'select(.coverage.full == true) | "- **Complete inventory audit** — \(.coverage.python_test_files) Python files, \(.coverage.node_test_files) Node files, and \(.coverage.candidate_verifier_tests) candidate-verifier tests; composed candidate and frontend build included."' \
            validation-matrix.json >> "$GITHUB_STEP_SUMMARY"
          jq -r 'select(.coverage.full == true) | "- **Bounded Manager split** — \(.coverage.manager_non_api_partitions | length) exhaustive non-API partitions."' \
            validation-matrix.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation plan
        uses: actions/upload-artifact@v7
        with:
          name: validation-plan
          path: |
            changed-files.txt
            validation-matrix.json
          retention-days: 14

  validation:
    name: validation / ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python
        if: ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        if: ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install CI contract dependencies
        if: ${{ matrix.python && matrix.python_dependencies == 'pytest' }}
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install pytest

      - name: Install project test dependencies
        if: ${{ matrix.python && matrix.python_dependencies == 'project' }}
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --requirement requirements-test.txt

      - name: Run validation shard
        env:
          VALIDATION_COMMAND: ${{ matrix.command }}
        run: bash -euo pipefail -c "$VALIDATION_COMMAND"

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-report-${{ matrix.name }}
          path: |
            layered-validation-report*.json
            candidate-report*.json
          if-no-files-found: ignore
          retention-days: 14

  release-candidate:
    name: release-candidate
    needs:
      - plan
      - validation
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Require every planned shard to pass
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          VALIDATION_RESULT: ${{ needs.validation.result }}
          SHARD_COUNT: ${{ needs.plan.outputs.shard-count }}
        run: |
          if [[ "$PLAN_RESULT" != "success" ]]; then
            echo "Validation planning failed: $PLAN_RESULT" >&2
            exit 1
          fi
          if [[ "$VALIDATION_RESULT" != "success" ]]; then
            echo "One or more of the $SHARD_COUNT validation shards failed: $VALIDATION_RESULT" >&2
            exit 1
          fi
          echo "All $SHARD_COUNT planned validation shards passed."
