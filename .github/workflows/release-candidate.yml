name: Release candidate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-candidate:
    name: release-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --requirement requirements-test.txt

      - name: Select changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --name-only --diff-filter=ACMRD "${BASE_SHA:-HEAD^}" HEAD > changed-files.txt

      - name: Run layered validation
        run: >-
          .venv/bin/python scripts/run_layered_validation.py
          --report layered-validation-report.json
          --changed-file-list changed-files.txt

      - name: Upload layered validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: layered-validation-report
          path: layered-validation-report.json
          if-no-files-found: ignore
          retention-days: 14
