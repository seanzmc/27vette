name: Codex finding disposition

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed
  pull_request_review_comment:
    types:
      - created
      - edited
      - deleted
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional pull request number; blank evaluates every open PR
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: codex-finding-disposition-${{ github.event.pull_request.number || inputs.pr_number || github.event_name }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Refresh Codex disposition status
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out trusted default-branch evaluator
        uses: actions/checkout@v7
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Evaluate current Codex findings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          args=(--repository "$GITHUB_REPOSITORY")
          if [[ -n "$PR_NUMBER" ]]; then
            args+=(--pr-number "$PR_NUMBER")
          fi
          python .github/scripts/codex_finding_disposition.py "${args[@]}"
